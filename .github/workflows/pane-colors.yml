name: Pane colors custom build
on:
  push:
    branches: [feat/pane-color-schemes]
permissions:
  contents: read
concurrency:
  group: pane-colors-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    if: github.repository == 'jonasgwozdz/herdr'
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.1
          components: rustfmt,clippy
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: just,cargo-nextest
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-bin: false
          key: pane-colors-macos
      - name: Format and save exact patch
        run: |
          cargo fmt --check
          git diff -- src > formatting.patch
      - name: Check and test
        run: |
          just ci 'not binary(live_handoff)'
          python3 scripts/config_reference_check.py
          python3 -m unittest scripts.test_herdr_color
      - name: Profile pane-color scaling
        run: cargo test --locked --bin herdr pane_color_scaling_profile -- --ignored --nocapture --test-threads=1
      - name: Build custom client
        run: cargo build --release --locked
      - name: Package custom client
        run: |
          cp target/release/herdr herdr-pane-colors
          shasum -a 256 herdr-pane-colors scripts/herdr_color.py > BUILD_INFO.txt
          echo "source_commit=$GITHUB_SHA" >> BUILD_INFO.txt
          rustc --version >> BUILD_INFO.txt
          file herdr-pane-colors >> BUILD_INFO.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: herdr-pane-colors-macos
          path: |
            herdr-pane-colors
            BUILD_INFO.txt
            scripts/herdr_color.py
            formatting.patch
          retention-days: 7
